
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お散歩の住人</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      background: #f3f1eb;
      color: #45483f;
      font-family: sans-serif;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 55px;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 12px;
      color: #88897f;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .message {
      margin: 65px 0 35px;
      padding: 25px 15px;
      background: #ffffff;
      border-radius: 16px;
      line-height: 2;
      color: #77786e;
    }

    button {
      width: 100%;
      padding: 17px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      background: #78836b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.secondary {
      background: #d9d8cc;
      color: #55564e;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="container">
    <h1>お散歩の住人</h1>
    <div class="subtitle">いつもの道に、会いたい人がいる。</div>

    <div class="message">
      今日も、あの人に会いに行こう。<br>
      いつもの道の、その先へ。
    </div>
    <div id="map" style="height: 400px; margin: 20px 0; border-radius: 16px;"></div>

<button id="startWalk">散歩に出かける</button>
    <button class="secondary">コースを設定する</button>
  </div>
<script>
  const map = L.map("map").setView([35.0, 137.0], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let walking = false;
  let watchId = null;
  let currentMarker = null;
let routeCoordinates = [];
let routeLine = null;
  
  const startButton = document.getElementById("startWalk");

  startButton.addEventListener("click", function() {

    if (walking) {
      walking = false;
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      startButton.textContent = "散歩に出かける";
      alert("お散歩おつかれさまでした！");
      return;
    }

    if (!navigator.geolocation) {
      alert("この端末では位置情報が使えません。");
      return;
    }

    walking = true;
    startButton.textContent = "散歩を終了する";

    watchId = navigator.geolocation.watchPosition(
      function(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        map.setView([lat, lng], 16);
        routeCoordinates.push([lat, lng]);

if (routeLine) {
  routeLine.setLatLngs(routeCoordinates);
} else {
  routeLine = L.polyline(routeCoordinates, {
    color: "#78836b",
    weight: 5
  }).addTo(map);
}

        if (currentMarker) {
          currentMarker.setLatLng([lat, lng]);
        } else {
          currentMarker = L.marker([lat, lng]).addTo(map);
        }

        currentMarker.bindPopup("ここが現在地です！");
      },
      function() {
        alert("現在地を取得できませんでした。");
        walking = false;
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        startButton.textContent = "散歩に出かける";
      },
      {
        enableHighAccuracy: true
      }
    );

  });
</script>
</body>
</html>
