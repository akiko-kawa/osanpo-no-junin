
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お散歩の住人</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      background: #f3f1eb;
      color: #45483f;
      font-family: sans-serif;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 55px;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 12px;
      color: #88897f;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .message {
      margin: 65px 0 35px;
      padding: 25px 15px;
      background: #ffffff;
      border-radius: 16px;
      line-height: 2;
      color: #77786e;
    }

    button {
      width: 100%;
      padding: 17px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      background: #78836b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.secondary {
      background: #d9d8cc;
      color: #55564e;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="container">
    <h1>お散歩の住人</h1>
    <div class="subtitle">いつもの道に、会いたい人がいる。</div>

    <div class="message">
      今日も、あの人に会いに行こう。<br>
      いつもの道の、その先へ。
    </div>
    <div id="map" style="height: 400px; margin: 20px 0; border-radius: 16px;"></div>
    <div id="walkInfo" style="display: flex; justify-content: space-around; background: white; padding: 18px; border-radius: 16px; margin: 15px 0;">
  <div>
    <div style="font-size: 12px; color: #888;">歩いた距離</div>
    <div id="distance" style="font-size: 24px;">0.00 km</div>
  </div>
  <div>
    <div style="font-size: 12px; color: #888;">散歩した時間</div>
    <div id="elapsed" style="font-size: 24px;">00:00:00</div>
  </div>
</div>
<div id="walkResult" style="display: none; background: white; padding: 24px; border-radius: 16px; margin: 15px 0; text-align: center;">
  <h2>お散歩おつかれさまでした！</h2>
  <p>今日もいい散歩でしたね。</p>
  <div style="margin: 20px 0;">
    <div style="color: #888; font-size: 13px;">歩いた距離</div>
    <div id="resultDistance" style="font-size: 28px;">0.00 km</div>
  </div>
  <div>
    <div style="color: #888; font-size: 13px;">散歩した時間</div>
    <div id="resultElapsed" style="font-size: 28px;">00:00:00</div>
  </div>
</div>
<div id="historyArea" style="background: white; padding: 20px; border-radius: 16px; margin: 15px 0;">
  <h2 style="font-size: 18px;">お散歩の記録</h2>
  <div id="historyList">まだ記録はありません。</div>
</div>
    
<button id="startWalk">散歩に出かける</button>
    <button class="secondary">コースを設定する</button>
  </div>
<script>
  const map = L.map("map").setView([35.0, 137.0], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let walking = false;
  let watchId = null;
  let currentMarker = null;
let routeCoordinates = [];
let routeLine = null;
let lastPosition = null;

function saveWalkState() {
  const state = {
    walking: walking,
    totalDistance: totalDistance,
    startTime: startTime,
    lastPosition: lastPosition
  };

  localStorage.setItem("currentWalk", JSON.stringify(state));
}

function loadWalkState() {
  const saved = localStorage.getItem("currentWalk");

  if (!saved) return;

  const state = JSON.parse(saved);

  if (!state.walking) return;

  walking = true;
  totalDistance = state.totalDistance || 0;
  startTime = state.startTime;
  document.getElementById("distance").textContent =
  (totalDistance / 1000).toFixed(2) + " km";
  lastPosition = state.lastPosition || null;
}
  
function resumeWalkTimer() {
  if (!walking || !startTime) return;

  clearInterval(timerInterval);

  timerInterval = setInterval(function() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);

    const hours = String(Math.floor(elapsed / 3600)).padStart(2, "0");
    const minutes = String(Math.floor((elapsed % 3600) / 60)).padStart(2, "0");
    const seconds = String(elapsed % 60).padStart(2, "0");

    document.getElementById("elapsed").textContent =
      hours + ":" + minutes + ":" + seconds;
  }, 1000);
}
  
  let totalDistance = 0;
let startTime = null;
let timerInterval = null;
  let walkHistory = JSON.parse(localStorage.getItem("walkHistory")) || [];
 
  function calculateDistance(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const rad = Math.PI / 180;

  const dLat = (lat2 - lat1) * rad;
  const dLng = (lng2 - lng1) * rad;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.sin(dLng / 2) ** 2;

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c * 1000;
}
  
function showHistory() {
  const historyList = document.getElementById("historyList");

  if (walkHistory.length === 0) {
    historyList.textContent = "まだ記録はありません。";
    return;
  }

  historyList.innerHTML = "";

  walkHistory.slice().reverse().forEach(function(record) {
    const item = document.createElement("div");

    item.style.padding = "15px 0";
    item.style.borderBottom = "1px solid #eee";

    item.innerHTML = `
      <div style="font-size:13px; color:#888;">${record.date}</div>
      <div>距離：${record.distance}</div>
      <div>時間：${record.elapsed}</div>
    `;

    historyList.appendChild(item);
  });
}

showHistory();
  
function startGpsTracking() {
  watchId = navigator.geolocation.watchPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      if (lastPosition) {
        const moved = calculateDistance(
          lastPosition.lat,
          lastPosition.lng,
          lat,
          lng
        );

        if (moved >= 3 && moved < 100) {
          totalDistance += moved;
        }
      }

      lastPosition = { lat: lat, lng: lng };
      saveWalkState();

      document.getElementById("distance").textContent =
        (totalDistance / 1000).toFixed(2) + " km";

      map.setView([lat, lng], 16);
      routeCoordinates.push([lat, lng]);

      if (routeLine) {
        routeLine.setLatLngs(routeCoordinates);
      } else {
        routeLine = L.polyline(routeCoordinates, {
          color: "#78836b",
          weight: 5
        }).addTo(map);
      }

      if (currentMarker) {
        currentMarker.setLatLng([lat, lng]);
      } else {
        currentMarker = L.marker([lat, lng]).addTo(map);
      }

      currentMarker.bindPopup("ここが現在地です！");
    },
    function() {
      alert("現在地を取得できませんでした。");
    },
    {
      enableHighAccuracy: true
    }
  );
}

  const startButton = document.getElementById("startWalk");

  startButton.addEventListener("click", function() {

    if (walking) {
      walking = false;
      localStorage.removeItem("currentWalk");
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      clearInterval(timerInterval);
timerInterval = null;
      document.getElementById("resultDistance").textContent =
  document.getElementById("distance").textContent;

document.getElementById("resultElapsed").textContent =
  document.getElementById("elapsed").textContent;
      const walkRecord = {
  date: new Date().toLocaleString("ja-JP"),
  distance: document.getElementById("distance").textContent,
  elapsed: document.getElementById("elapsed").textContent
};

walkHistory.push(walkRecord);

localStorage.setItem("walkHistory", JSON.stringify(walkHistory));
      showHistory();
      
      document.getElementById("walkResult").style.display = "block";
      startButton.textContent = "散歩に出かける";
      alert("お散歩おつかれさまでした！");
      return;
    }

    if (!navigator.geolocation) {
      alert("この端末では位置情報が使えません。");
      return;
    }

    walking = true;
    startButton.textContent = "散歩を終了する";
    totalDistance = 0;
lastPosition = null;
routeCoordinates = [];
routeLine = null;

document.getElementById("distance").textContent = "0.00 km";
document.getElementById("elapsed").textContent = "00:00:00";
document.getElementById("walkResult").style.display = "none";

    startTime = Date.now();
    saveWalkState();

timerInterval = setInterval(function() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);

  const hours = String(Math.floor(elapsed / 3600)).padStart(2, "0");
  const minutes = String(Math.floor((elapsed % 3600) / 60)).padStart(2, "0");
  const seconds = String(elapsed % 60).padStart(2, "0");

  document.getElementById("elapsed").textContent =
    hours + ":" + minutes + ":" + seconds;
}, 1000);
    
startGpsTracking();

  });
  loadWalkState();

if (walking) {
  startButton.textContent = "散歩を終了する";
  document.getElementById("walkResult").style.display = "none";

  // 再読み込み中の移動距離を誤算しないようにする
  lastPosition = null;

  resumeWalkTimer();
  startGpsTracking();
}
</script>
</body>
</html>
